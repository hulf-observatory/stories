# Builds the site and publishes dist/ to GitHub Pages.
# Pages source for the repo must be set to "GitHub Actions" (Settings → Pages).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # the site lives at the root of its custom subdomain
          VITE_BASE: ${{ vars.VITE_BASE || '/stories/' }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_TOOLS_URL: ${{ vars.VITE_TOOLS_URL }}
          VITE_STORIES_URL: ${{ vars.VITE_STORIES_URL }}
          VITE_MAPS_URL: ${{ vars.VITE_MAPS_URL }}
          VITE_TIMELINE_URL: ${{ vars.VITE_TIMELINE_URL }}
          VITE_DATA_URL: ${{ vars.VITE_DATA_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
